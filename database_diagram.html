<style>
  #erd {
    padding: 0 0 8px;
  }

  #erd svg {
    width: 100%;
  }
</style>
<div id="erd"></div>
<script type="module">
  import mermaid from 'https://esm.sh/mermaid@11/dist/mermaid.esm.min.mjs';
  const dark = true;
  await document.fonts.ready;
  mermaid.initialize({
    startOnLoad: false,
    theme: 'base',
    fontFamily: '"Anthropic Sans", sans-serif',
    themeVariables: {
      darkMode: dark,
      fontSize: '13px',
      fontFamily: '"Anthropic Sans", sans-serif',
      lineColor: '#FFFFFF',
      textColor: '#3d3d3a',
      primaryColor: '#dddddd',
      primaryTextColor: '#000000',
      primaryBorderColor: '#00ff00',
      edgeLabelBackground: '#ff0000',
    },
  });
  const diagram = `erDiagram
  Account {
    INT userId PK
    VARCHAR username
    VARCHAR passwordHash
    VARCHAR email
  }
  CTF {
    INT ctfId PK
    TEXT description
    VARCHAR path
    VARCHAR flag
  }
  Vulnerability {
    INT vulnId PK
    VARCHAR name
    TEXT description
    INT ctfId FK
  }
  CVE {
    TEXT cveId PK
    TEXT description
  }
  CVEVulnerability {
    TEXT cveId FK
    INT vulnId FK
  }
  Question {
    INT questionId PK
    INT vulnId FK
    INT questionNumber
    TEXT question
    TEXT answer
  }
  Hint {
    INT hintId PK
    INT questionId FK
    INT hintNumber
    TEXT hint
  }
  CompletedQuestion {
    INT userId FK
    INT questionId FK
  }
  CompletedCTF {
    INT userId FK
    INT ctfId FK
  }

  Account ||--o{ CompletedQuestion : "Account.userId"
  Account ||--o{ CompletedCTF : "Account.userId"
  Question ||--o{ CompletedQuestion : "Question.questionId"
  CTF ||--o{ CompletedCTF : "CTF.ctfId"
  Vulnerability ||--o{ Question : "Vulnerability.vulnId"
  Question ||--o{ Hint : "Question.questionId"
  CTF ||--o{ Vulnerability : "CTF.ctfId"
  CVE ||--o{ CVEVulnerability : "CVE.cveId"
  Vulnerability ||--o{ CVEVulnerability : "Vulnerability.vulnId"
`;
  const { svg } = await mermaid.render('erd-svg', diagram);
  document.getElementById('erd').innerHTML = svg;

  document.querySelectorAll('#erd svg .node').forEach(node => {
    const firstPath = node.querySelector('path[d]');
    if (!firstPath) return;
    const d = firstPath.getAttribute('d');
    const nums = d.match(/-?[\d.]+/g)?.map(Number);
    if (!nums || nums.length < 8) return;
    const xs = [nums[0], nums[2], nums[4], nums[6]];
    const ys = [nums[1], nums[3], nums[5], nums[7]];
    const x = Math.min(...xs), y = Math.min(...ys);
    const w = Math.max(...xs) - x, h = Math.max(...ys) - y;
    const rect = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
    rect.setAttribute('x', x); rect.setAttribute('y', y);
    rect.setAttribute('width', w); rect.setAttribute('height', h);
    rect.setAttribute('rx', '8');
    for (const a of ['fill', 'stroke', 'stroke-width', 'class', 'style']) {
      if (firstPath.hasAttribute(a)) rect.setAttribute(a, firstPath.getAttribute(a));
    }
    firstPath.replaceWith(rect);
  });

  document.querySelectorAll('#erd svg .row-rect-odd path, #erd svg .row-rect-even path').forEach(p => {
    p.setAttribute('stroke', 'none');
  });
</script>

<body bgcolor="black"></body>
