{% extends "base.html" %}
{% block title %}Quiz - VulTutor{% endblock %}

{% block content %}
<div id="loadingState" class="text-center py-5">
  <div class="spinner-border text-success" role="status"></div>
  <p class="mt-2 text-muted">Loading questions…</p>
</div>

<div id="quizContent" class="d-none">
  <nav aria-label="breadcrumb" class="mb-3">
    <ol class="breadcrumb">
      <li class="breadcrumb-item"><a href="/home" class="vt-link">Dashboard</a></li>
      <li class="breadcrumb-item"><a href="#" class="vt-link" id="vulnLink"></a></li>
      <li class="breadcrumb-item active">Quiz</li>
    </ol>
  </nav>

  <h2 class="vt-heading mb-1"><i class="bi bi-question-circle me-2"></i>Quiz</h2>
  <p class="text-muted mb-4" id="progressText"></p>

  <div id="questionList"></div>

  <a href="/home" class="btn btn-outline-secondary mt-3">
    <i class="bi bi-arrow-left me-1"></i>Back to Dashboard
  </a>
</div>
{% endblock %}

{% block scripts %}
<script>
const VULN_ID = {{ vuln_id }};
let questions = [];

async function loadQuestions() {
  requireAuth();
  const res = await apiFetch(`/api/vulnerabilities/${VULN_ID}/questions`);
  if (!res.ok) { showFlash("Failed to load questions.", "danger"); return; }

  const data = await res.json();
  questions = data.questions;

  document.getElementById("vulnLink").textContent = data.vulnName;
  document.getElementById("vulnLink").href = `/vulnerability/${VULN_ID}`;

  renderQuestions();

  document.getElementById("loadingState").classList.add("d-none");
  document.getElementById("quizContent").classList.remove("d-none");
}

function renderQuestions() {
  const completed = questions.filter(q => q.completed).length;
  document.getElementById("progressText").textContent =
    `${completed} / ${questions.length} questions completed`;

  const container = document.getElementById("questionList");
  container.innerHTML = "";

  questions.forEach((q, idx) => {
    const card = document.createElement("div");
    card.className = `card vt-card mb-3 ${q.completed ? "vt-card-done" : ""}`;
    card.id = `qcard-${q.questionId}`;

    const hintsHtml = q.hints.map((h, hi) => `
      <div class="vt-hint d-none" id="hint-${q.questionId}-${hi}">
        <i class="bi bi-lightbulb-fill text-warning me-1"></i>
        <em>${escHtml(h.hint)}</em>
      </div>`).join("");

    card.innerHTML = `
      <div class="card-body">
        <div class="d-flex align-items-center mb-2">
          <span class="badge bg-secondary me-2">Q${q.questionNumber}</span>
          <strong>${escHtml(q.question)}</strong>
          ${q.completed ? '<span class="badge bg-success ms-auto"><i class="bi bi-check-lg me-1"></i>Done</span>' : ""}
        </div>

        ${q.completed ? "" : `
        <div class="input-group mt-2">
          <input type="text" class="form-control" id="ans-${q.questionId}" placeholder="Your answer…" />
          <button class="btn btn-success" onclick="submitAnswer(${q.questionId})">Submit</button>
        </div>
        <div id="result-${q.questionId}" class="mt-2"></div>
        `}

        ${q.hints.length > 0 && !q.completed ? `
        <div class="mt-3">
          ${hintsHtml}
          <button class="btn btn-sm btn-outline-warning mt-1" id="hintBtn-${q.questionId}"
            onclick="revealHint(${q.questionId}, ${q.hints.length})">
            <i class="bi bi-lightbulb me-1"></i>Show Hint
          </button>
        </div>` : ""}
      </div>`;

    container.appendChild(card);
  });
}

// Track how many hints have been shown per question
const hintCounters = {};

function revealHint(questionId, totalHints) {
  if (!(questionId in hintCounters)) hintCounters[questionId] = 0;
  const idx = hintCounters[questionId];
  const hintEl = document.getElementById(`hint-${questionId}-${idx}`);
  if (hintEl) hintEl.classList.remove("d-none");
  hintCounters[questionId]++;
  if (hintCounters[questionId] >= totalHints) {
    document.getElementById(`hintBtn-${questionId}`).disabled = true;
    document.getElementById(`hintBtn-${questionId}`).textContent = "All hints shown";
  }
}

async function submitAnswer(questionId) {
  const input = document.getElementById(`ans-${questionId}`);
  const answer = input.value.trim();
  if (!answer) return;

  const resultDiv = document.getElementById(`result-${questionId}`);

  const res = await apiFetch(`/api/vulnerabilities/${VULN_ID}/questions/${questionId}`, {
    method: "POST",
    body: JSON.stringify({ answer }),
  });

  const body = await res.json();
  if (body.correct) {
    resultDiv.innerHTML = `<span class="text-success"><i class="bi bi-check-circle-fill me-1"></i>${escHtml(body.message)}</span>`;
    // Mark as complete and re-render
    const q = questions.find(q => q.questionId === questionId);
    if (q) q.completed = true;
    setTimeout(() => renderQuestions(), 800);
  } else {
    resultDiv.innerHTML = `<span class="text-danger"><i class="bi bi-x-circle-fill me-1"></i>${escHtml(body.message)}</span>`;
  }
}

loadQuestions();
</script>
{% endblock %}
