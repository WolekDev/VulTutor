{% extends "base.html" %}
{% block title %}Quiz - VulTutor{% endblock %}

{% block content %}
<div id="loadingState" class="text-center py-5">
  <div class="spinner-border text-success" role="status"></div>
  <p class="mt-2 text-muted">Loading questions…</p>
</div>

<div id="quizContent" class="d-none">
  <!-- Breadcrumb removed (top nav present) -->

  <!-- Top navigation for vulnerability pages: Learn / Quiz / CTF -->
  <div class="mb-3">
    <div class="btn-group" role="group" aria-label="vuln-nav">
      <a href="/vulnerability/{{ vuln_id }}" class="btn btn-outline-light">Learn</a>
      <a href="/vulnerability/{{ vuln_id }}/questions" class="btn btn-primary">Quiz</a>
      <a href="/vulnerability/{{ vuln_id }}/ctf" class="btn btn-outline-light">CTF</a>
    </div>
  </div>
  <p class="text-muted mb-4" id="progressText"></p>

  <div id="questionList"></div>

  <div class="mb-3">
    <a href="/home" class="btn btn-outline-secondary">
      <i class="bi bi-arrow-left me-1"></i>Back to Dashboard
    </a>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script>
  // Page-scoped Sanitizer Utility to ensure it is always available
  function escHtml(string) {
    if (!string) return "";
    return String(string)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");
  }

  const VULN_ID = {{ vuln_id | tojson }};
  let questions = [];
  let hintCounters = {}; // questionId -> how many hints revealed

  (async () => {
    requireAuth();

    // Vulnerability name is not shown in a breadcrumb anymore; skip setting breadcrumb link

    // 2. Fetch Questions
    const res = await apiFetch(`/api/vulnerabilities/${VULN_ID}/questions`);
    if (!res.ok) {
      showFlash("Failed to load quiz questions.", "danger");
      return;
    }

    const body = await res.json();
    // Dynamically handle either a wrapped array object response or raw array list safely
    questions = body.questions || body;

    renderQuestions();

    document.getElementById("loadingState").classList.add("d-none");
    document.getElementById("quizContent").classList.remove("d-none");
  })();

  function updateProgressHeader() {
    const total = questions.length;
    const completed = questions.filter(q => q.completed).length;
    document.getElementById("progressText").textContent =
      `Completed: ${completed} / ${total}`;
  }

  function renderQuestions() {
    updateProgressHeader();
    const container = document.getElementById("questionList");
    if (questions.length === 0) {
      container.innerHTML = '<p class="text-muted">No questions available for this module.</p>';
      return;
    }

    container.innerHTML = questions.map(q => {
      const currentHintIdx = hintCounters[q.questionId] || 0;
      const totalHints = q.hints ? q.hints.length : 0;
      const hintBtnDisabled = currentHintIdx >= totalHints;
      const hintBtnText = hintBtnDisabled ? "All hints shown" : `Show Hint (${currentHintIdx}/${totalHints})`;

      const hintsHtml = q.hints ? q.hints.map(h => `
        <div id="hint-${q.questionId}-${h.hintNumber}" class="alert alert-info py-2 my-1 d-none font-sans" style="font-size:0.9rem;">
          <i class="bi bi-lightbulb me-1"></i><strong>Hint ${h.hintNumber}:</strong> ${escHtml(h.hint)}
        </div>
      `).join("") : "";

      const statusHeader = q.completed
        ? `<span class="badge bg-success mb-2"><i class="bi bi-check-circle-fill me-1"></i>Completed</span>`
        : `<span class="badge bg-secondary mb-2">Unsolved</span>`;

      // Formulate action button inside a standardized responsive width column layout
      const actionButton = q.completed
        ? `<button class="btn btn-outline-primary w-100" onclick="enableRetry(${q.questionId})">
             <i class="bi bi-arrow-counterclockwise me-1"></i>Retry
           </button>`
        : `<button class="btn btn-success w-100" onclick="submitAnswer(${q.questionId})">
             <i class="bi bi-send-fill me-1"></i>Submit
           </button>`;

      return `
        <div class="card vt-card mb-4" id="qcard-${q.questionId}">
          <div class="card-body">
            <div class="d-flex justify-content-between align-items-start">
              <h5 class="card-title text-light">Question ${q.questionNumber}</h5>
              ${statusHeader}
            </div>
            
            <pre class="vt-description my-3" style="white-space: pre-wrap; font-family: inherit;">${escHtml(q.question)}</pre>

            <div class="row g-2 align-items-center mb-3">
              <div class="col-sm-8 col-md-9">
                <input type="text" class="form-control font-monospace" id="ans-${q.questionId}" 
                       placeholder="Type your answer here..." 
                       onkeydown="handleEnterKey(event, ${q.questionId})"
                       ${q.completed ? 'value="You got it!" disabled' : ''}>
              </div>
              <div class="col-sm-4 col-md-3">
                ${actionButton}
              </div>
            </div>

            <div id="result-${q.questionId}" class="mb-3 font-monospace">
              ${q.completed ? `<span class="text-success"><i class="bi bi-patch-check-fill me-1"></i>You submitted the correct answer. You can still retry above to test variations!</span>` : ''}
            </div>

            <div class="border-top pt-2">
              <button class="btn btn-sm btn-outline-warning mb-2" id="hintBtn-${q.questionId}" 
                      onclick="revealHint(${q.questionId}, ${totalHints})" ${hintBtnDisabled ? "disabled" : ""}>
                <i class="bi bi-lightbulb-fill me-1"></i>${hintBtnText}
              </button>
              <div id="hintsContainer-${q.questionId}">
                ${hintsHtml}
              </div>
            </div>

          </div>
        </div>
      `;
    }).join("");

    // Restore visibilities for expanded hints
    questions.forEach(q => {
      const currentHintIdx = hintCounters[q.questionId] || 0;
      for (let i = 1; i <= currentHintIdx; i++) {
        const hintEl = document.getElementById(`hint-${q.questionId}-${i}`);
        if (hintEl) hintEl.classList.remove("d-none");
      }
    });
  }

  function revealHint(questionId, totalHints) {
    if (!(questionId in hintCounters)) hintCounters[questionId] = 0;
    const idx = hintCounters[questionId];

    hintCounters[questionId]++;
    const hintEl = document.getElementById(`hint-${questionId}-${hintCounters[questionId]}`);
    if (hintEl) hintEl.classList.remove("d-none");

    if (hintCounters[questionId] >= totalHints) {
      document.getElementById(`hintBtn-${questionId}`).disabled = true;
      document.getElementById(`hintBtn-${questionId}`).textContent = "All hints shown";
    } else {
      document.getElementById(`hintBtn-${questionId}`).textContent = `Show Hint (${hintCounters[questionId]}/${totalHints})`;
    }
  }

  function enableRetry(questionId) {
    const targetQuestion = questions.find(q => q.questionId === questionId);
    if (targetQuestion) {
      targetQuestion.completed = false;
      renderQuestions();

      const inputField = document.getElementById(`ans-${questionId}`);
      if (inputField) {
        inputField.value = "";
        inputField.focus();
      }
    }
  }

  function handleEnterKey(event, questionId) {
    if (event.key === "Enter") {
      event.preventDefault();
      submitAnswer(questionId);
    }
  }

  async function submitAnswer(questionId) {
    const input = document.getElementById(`ans-${questionId}`);
    const answer = input.value.trim();
    if (!answer) return;

    const resultDiv = document.getElementById(`result-${questionId}`);
    resultDiv.innerHTML = '<span class="text-muted"><i class="spinner-border spinner-border-sm me-2"></i>Evaluating...</span>';

    const res = await apiFetch(`/api/vulnerabilities/${VULN_ID}/questions/${questionId}`, {
      method: "POST",
      body: JSON.stringify({ answer }),
    });

    const body = await res.json();
    if (body.correct) {
      resultDiv.innerHTML = `<span class="text-success"><i class="bi bi-check-circle-fill me-1"></i>${escHtml(body.message)}</span>`;
      const q = questions.find(q => q.questionId === questionId);
      if (q) q.completed = true;
      setTimeout(() => renderQuestions(), 800);
    } else {
      resultDiv.innerHTML = `<span class="text-danger"><i class="bi bi-x-circle-fill me-1"></i>${escHtml(body.message)}</span>`;
    }
  }
</script>
{% endblock %}
