{% extends "base.html" %}
{% block title %}Login - VulTutor{% endblock %}

{% block content %}
<div class="row justify-content-center mt-5">
  <div class="col-12 col-sm-8 col-md-6 col-lg-4">

    <div class="text-center mb-4">
      <img src="{{ url_for('static', filename='img/LOGO.png') }}" alt="VulTutor" class="vt-login-logo">
      <h2 class="vt-heading mt-2">Sign In</h2>
      <p class="text-muted">Access your VulTutor account</p>
    </div>

    <div class="card vt-card">
      <div class="card-body p-4">
        <form id="loginForm" novalidate>

          <div class="mb-3">
            <label for="username" class="form-label">Username</label>
            <div class="input-group">
              <span class="input-group-text"><i class="bi bi-person"></i></span>
              <input type="text" class="form-control" id="username" placeholder="Enter username" required />
            </div>
          </div>

          <div class="mb-4">
            <label for="password" class="form-label">Password</label>
            <div class="input-group">
              <span class="input-group-text"><i class="bi bi-lock"></i></span>
              <input type="password" class="form-control" id="password" placeholder="Enter password" required />
            </div>
          </div>

          <div id="loginError" class="alert alert-danger py-2 d-none"></div>

          <button type="submit" class="btn btn-success w-100" id="loginBtn">
            <span id="loginSpinner" class="spinner-border spinner-border-sm me-2 d-none"></span>
            Sign In
          </button>
        </form>
      </div>
    </div>

    <p class="text-center mt-3 text-muted">
      No account? <a href="/register" class="vt-link">Register here</a>
    </p>

  </div>
</div>
{% endblock %}

{% block scripts %}
<script>
document.getElementById("loginForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const btn = document.getElementById("loginBtn");
  const spinner = document.getElementById("loginSpinner");
  const errBox = document.getElementById("loginError");

  const username = document.getElementById("username").value.trim();
  const password = document.getElementById("password").value;

  errBox.classList.add("d-none");
  btn.disabled = true;
  spinner.classList.remove("d-none");

  try {
    const res = await fetch("/api/sessions", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ username, password }),
    });
    const body = await res.json();
    if (res.status === 201) {
      localStorage.setItem("vt_token", body.token);
      window.location.href = "/home";
    } else {
      errBox.textContent = body.message || "Login failed";
      errBox.classList.remove("d-none");
    }
  } catch {
    errBox.textContent = "Network error – please try again.";
    errBox.classList.remove("d-none");
  } finally {
    btn.disabled = false;
    spinner.classList.add("d-none");
  }
});

// Redirect if already logged in
if (localStorage.getItem("vt_token")) window.location.href = "/home";
</script>
{% endblock %}
