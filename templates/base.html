<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}VulTutor{% endblock %}</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}" />
</head>
<body>

<!-- Navbar -->
<nav class="navbar navbar-expand-lg navbar-dark vt-navbar" id="mainNav">
  <div class="container-fluid px-4">
    <a class="navbar-brand vt-brand" href="/home">
      <img src="static/img/LOGO.png" alt="VulTutor" class="vt-navbar-logo"> VulTutor
    </a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarContent">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarContent">
      <ul class="navbar-nav ms-auto align-items-lg-center gap-2" id="authNav">
        <!-- Populated by JS -->
      </ul>
    </div>
  </div>
</nav>

<!-- Flash area -->
<div id="flashArea" class="container mt-3" style="display:none;">
  <div id="flashMsg" class="alert alert-dismissible fade show" role="alert">
    <span id="flashText"></span>
    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
  </div>
</div>

<!-- Page content -->
<main class="container py-4">
  {% block content %}{% endblock %}
</main>

<footer class="vt-footer text-center py-3 mt-auto">
  <small class="text-muted">VulTutor - Learn security by breaking things (safely)</small>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="{{ url_for('static', filename='js/app.js') }}"></script>
{% block scripts %}{% endblock %}
</body>
</html>
