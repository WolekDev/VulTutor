{% extends "base.html" %}
{% block title %}Register – VulTutor{% endblock %}

{% block content %}
<div class="row justify-content-center mt-5">
  <div class="col-12 col-sm-8 col-md-6 col-lg-4">

    <div class="text-center mb-4">
      <i class="bi bi-person-plus vt-hero-icon"></i>
      <h2 class="vt-heading mt-2">Create Account</h2>
      <p class="text-muted">Join VulTutor and start learning</p>
    </div>

    <div class="card vt-card">
      <div class="card-body p-4">
        <form id="registerForm" novalidate>

          <div class="mb-3">
            <label for="username" class="form-label">Username <small class="text-muted">(min 3 chars)</small></label>
            <div class="input-group">
              <span class="input-group-text"><i class="bi bi-person"></i></span>
              <input type="text" class="form-control" id="username" placeholder="Choose a username" minlength="3" required />
            </div>
          </div>

          <div class="mb-3">
            <label for="email" class="form-label">Email</label>
            <div class="input-group">
              <span class="input-group-text"><i class="bi bi-envelope"></i></span>
              <input type="email" class="form-control" id="email" placeholder="you@example.com" required />
            </div>
          </div>

          <div class="mb-4">
            <label for="password" class="form-label">Password <small class="text-muted">(min 8 chars)</small></label>
            <div class="input-group">
              <span class="input-group-text"><i class="bi bi-lock"></i></span>
              <input type="password" class="form-control" id="password" placeholder="Choose a password" minlength="8" required />
            </div>
          </div>

          <div id="registerError" class="alert alert-danger py-2 d-none"></div>

          <button type="submit" class="btn btn-success w-100" id="registerBtn">
            <span id="registerSpinner" class="spinner-border spinner-border-sm me-2 d-none"></span>
            Create Account
          </button>
        </form>
      </div>
    </div>

    <p class="text-center mt-3 text-muted">
      Already have an account? <a href="/login" class="vt-link">Sign in</a>
    </p>

  </div>
</div>
{% endblock %}

{% block scripts %}
<script>
document.getElementById("registerForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const btn = document.getElementById("registerBtn");
  const spinner = document.getElementById("registerSpinner");
  const errBox = document.getElementById("registerError");

  const username = document.getElementById("username").value.trim();
  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;

  errBox.classList.add("d-none");

  if (username.length < 3) { errBox.textContent = "Username must be at least 3 characters."; errBox.classList.remove("d-none"); return; }
  if (password.length < 8) { errBox.textContent = "Password must be at least 8 characters."; errBox.classList.remove("d-none"); return; }

  btn.disabled = true;
  spinner.classList.remove("d-none");

  try {
    const res = await fetch("/api/register", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ username, email, password }),
    });
    const body = await res.json();
    if (res.status === 201) {
      localStorage.setItem("vt_token", body.token);
      window.location.href = "/home";
    } else {
      const msg = typeof body.message === "object" ? JSON.stringify(body.message) : body.message;
      errBox.textContent = msg || "Registration failed";
      errBox.classList.remove("d-none");
    }
  } catch {
    errBox.textContent = "Network error – please try again.";
    errBox.classList.remove("d-none");
  } finally {
    btn.disabled = false;
    spinner.classList.add("d-none");
  }
});

if (localStorage.getItem("vt_token")) window.location.href = "/home";
</script>
{% endblock %}
